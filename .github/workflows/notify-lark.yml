name: Notify Lark

on:
  workflow_dispatch:

jobs:
  send-lark-card:
    runs-on: ubuntu-latest

    steps:
      - name: Get Lark Access Token
        id: token
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl --silent --show-error \
              --request POST \
              "https://open.larksuite.com/open-apis/auth/v3/tenant_access_token/internal" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data "$(jq -nc \
                --arg app_id "$LARK_APP_ID" \
                --arg app_secret "$LARK_APP_SECRET" \
                '{
                  app_id: $app_id,
                  app_secret: $app_secret
                }'
              )"
          )"

          echo "$RESPONSE" | jq .

          CODE="$(echo "$RESPONSE" | jq -r '.code // -1')"
          TOKEN="$(echo "$RESPONSE" | jq -r '.tenant_access_token // empty')"

          if [[ "$CODE" != "0" || -z "$TOKEN" ]]; then
            echo "❌ Không lấy được Lark tenant access token."
            exit 1
          fi

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Send Lark Card
        env:
          LARK_TOKEN: ${{ steps.token.outputs.token }}

          VERDICT: Strong
          HO_TEN: Nguyễn Văn A
          ROLE: Designer
          SCORE: "85"
          PHONE: "0123456789"
          EMAIL: candidate@example.com
          OVERVIEW: Ứng viên có kinh nghiệm phù hợp với vị trí.
          CV_URL: https://drive.google.com/

        shell: bash

        run: |
          set -euo pipefail

          if [[ -z "${LARK_TOKEN:-}" ]]; then
            echo "❌ LARK_TOKEN đang rỗng."
            exit 1
          fi

          case "$VERDICT" in
            "Strong")
              TEMPLATE="green"
              ICON="🟢"
              ;;
            "Considerable")
              TEMPLATE="orange"
              ICON="🟡"
              ;;
            *)
              TEMPLATE="red"
              ICON="🔴"
              ;;
          esac

          CARD="$(
            jq -nc \
              --arg template "$TEMPLATE" \
              --arg icon "$ICON" \
              --arg ho_ten "$HO_TEN" \
              --arg role "$ROLE" \
              --arg score "$SCORE" \
              --arg verdict "$VERDICT" \
              --arg phone "$PHONE" \
              --arg email "$EMAIL" \
              --arg overview "$OVERVIEW" \
              --arg url "$CV_URL" \
              '
              {
                config: {
                  wide_screen_mode: true
                },
                header: {
                  template: $template,
                  title: {
                    tag: "plain_text",
                    content: ($icon + " CV Candidate Screening")
                  }
                },
                elements: [
                  {
                    tag: "div",
                    text: {
                      tag: "lark_md",
                      content: ("# 👤 " + $ho_ten)
                    }
                  },
                  {
                    tag: "div",
                    text: {
                      tag: "lark_md",
                      content: ("**💼 Vị trí ứng tuyển**\n" + $role)
                    }
                  },
                  {
                    tag: "hr"
                  },
                  {
                    tag: "div",
                    fields: [
                      {
                        is_short: true,
                        text: {
                          tag: "lark_md",
                          content: ("**⭐ Điểm**\n" + $score)
                        }
                      },
                      {
                        is_short: true,
                        text: {
                          tag: "lark_md",
                          content: ("**📊 Đánh giá**\n" + $verdict)
                        }
                      }
                    ]
                  },
                  {
                    tag: "div",
                    fields: [
                      {
                        is_short: true,
                        text: {
                          tag: "lark_md",
                          content: ("**📞 Điện thoại**\n" + $phone)
                        }
                      },
                      {
                        is_short: true,
                        text: {
                          tag: "lark_md",
                          content: ("**✉️ Email**\n" + $email)
                        }
                      }
                    ]
                  },
                  {
                    tag: "hr"
                  },
                  {
                    tag: "div",
                    text: {
                      tag: "lark_md",
                      content: ("### 📝 AI Summary\n\n" + $overview)
                    }
                  },
                  {
                    tag: "hr"
                  },
                  {
                    tag: "action",
                    actions: [
                      {
                        tag: "button",
                        type: "primary",
                        text: {
                          tag: "plain_text",
                          content: "📄 Xem CV trên Google Drive"
                        },
                        url: $url
                      }
                    ]
                  }
                ]
              }
              '
          )"

          RECEIVERS=(
            "ou_f77cf794a1319628941dd689ecc97e32"
            "ou_4eb96bd84a22b6511fcb316d35ded621"
            "ou_9f7de713af63322b36ee7e41f5731313"
          )

          FAIL=0

          for RID in "${RECEIVERS[@]}"; do
            PAYLOAD="$(
              jq -nc \
                --arg rid "$RID" \
                --arg card "$CARD" \
                '{
                  receive_id: $rid,
                  msg_type: "interactive",
                  content: $card
                }'
            )"

            RESP="$(
              curl --silent --show-error \
                --request POST \
                "https://open.larksuite.com/open-apis/im/v1/messages?receive_id_type=open_id" \
                --header "Authorization: Bearer $LARK_TOKEN" \
                --header "Content-Type: application/json; charset=utf-8" \
                --data "$PAYLOAD"
            )"

            CODE="$(echo "$RESP" | jq -r '.code // -1')"

            if [[ "$CODE" == "0" ]]; then
              echo "✅ Sent to $RID"
            else
              echo "❌ Failed to $RID"
              echo "$RESP" | jq . || echo "$RESP"
              FAIL=1
            fi
          done

          if [[ "$FAIL" -eq 1 ]]; then
            exit 1
          fi

          echo "🎉 All notifications sent successfully."
