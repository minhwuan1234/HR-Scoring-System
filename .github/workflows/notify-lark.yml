- name: Send Lark Card
  run: |
    VERDICT="${{ steps.cv.outputs.verdict }}"

    if [ "$VERDICT" = "Strong" ]; then
      TEMPLATE="green"
      ICON="🟢"
    elif [ "$VERDICT" = "Considerable" ]; then
      TEMPLATE="orange"
      ICON="🟡"
    else
      TEMPLATE="red"
      ICON="🔴"
    fi

    CARD=$(jq -n \
      --arg template "$TEMPLATE" \
      --arg icon "$ICON" \
      --arg ho_ten "${{ steps.cv.outputs.ho_ten }}" \
      --arg role "${{ steps.cv.outputs.role }}" \
      --arg score "${{ steps.cv.outputs.score }}" \
      --arg verdict "${{ steps.cv.outputs.verdict }}" \
      --arg phone "${{ steps.cv.outputs.phone }}" \
      --arg email "${{ steps.cv.outputs.email }}" \
      --arg overview "${{ steps.cv.outputs.overview }}" \
      --arg url "${{ steps.cv.outputs.url }}" \
      '
      {
        config: {
          wide_screen_mode: true
        },

        header: {
          template: $template,
          title: {
            tag: "plain_text",
            content: ($icon + " CV Candidate Screening")
          }
        },

        elements: [

          {
            tag: "div",
            text: {
              tag: "lark_md",
              content: ("# 👤 " + $ho_ten)
            }
          },

          {
            tag: "div",
            text: {
              tag: "lark_md",
              content: ("**💼 Vị trí ứng tuyển**\n" + $role)
            }
          },

          {
            tag: "hr"
          },

          {
            tag: "div",
            fields: [
              {
                is_short: true,
                text: {
                  tag: "lark_md",
                  content: ("**⭐ Điểm**\n" + $score)
                }
              },
              {
                is_short: true,
                text: {
                  tag: "lark_md",
                  content: ("**📊 Đánh giá**\n" + $verdict)
                }
              }
            ]
          },

          {
            tag: "div",
            fields: [
              {
                is_short: true,
                text: {
                  tag: "lark_md",
                  content: ("**📞 Điện thoại**\n" + $phone)
                }
              },
              {
                is_short: true,
                text: {
                  tag: "lark_md",
                  content: ("**✉️ Email**\n" + $email)
                }
              }
            ]
          },

          {
            tag: "hr"
          },

          {
            tag: "div",
            text: {
              tag: "lark_md",
              content: ("### 📝 AI Summary\n\n" + $overview)
            }
          },

          {
            tag: "hr"
          },

          {
            tag: "action",
            actions: [
              {
                tag: "button",
                type: "primary",
                text: {
                  tag: "plain_text",
                  content: "📄 Xem CV trên Google Drive"
                },
                url: $url
              }
            ]
          }

        ]
      }')

    RECEIVERS="ou_f77cf794a1319628941dd689ecc97e32 ou_4eb96bd84a22b6511fcb316d35ded621 ou_9f7de713af63322b36ee7e41f5731313"

    FAIL=0

    for RID in $RECEIVERS; do

      RESP=$(curl -s -X POST \
        "https://open.larksuite.com/open-apis/im/v1/messages?receive_id_type=open_id" \
        -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
        -H "Content-Type: application/json; charset=utf-8" \
        -d "$(jq -n \
            --arg rid "$RID" \
            --arg card "$CARD" \
            '{
              receive_id: $rid,
              msg_type: "interactive",
              content: $card
            }'
        )")

      CODE=$(echo "$RESP" | jq -r '.code')

      if [ "$CODE" = "0" ]; then
        echo "✅ Sent to $RID"
      else
        echo "❌ Failed to $RID"
        echo "$RESP"
        FAIL=1
      fi

    done

    if [ "$FAIL" = "1" ]; then
      exit 1
    fi

    echo "🎉 All notifications sent successfully."
