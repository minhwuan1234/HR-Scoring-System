name: Notify Lark

on:
  push:
    branches:
      - main
    paths:
      - "cv/latest.json"

  workflow_dispatch:

jobs:
  send-lark-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read CV data
        id: cv
        shell: bash
        run: |
          set -euo pipefail

          FILE="cv/latest.json"

          if [[ ! -f "$FILE" ]]; then
            echo "❌ Không tìm thấy file $FILE"
            exit 1
          fi

          if ! jq empty "$FILE" >/dev/null 2>&1; then
            echo "❌ File $FILE không phải JSON hợp lệ"
            exit 1
          fi

          JSON_TYPE="$(jq -r 'type' "$FILE")"

          if [[ "$JSON_TYPE" == "array" ]]; then
            COUNT="$(jq 'length' "$FILE")"

            if [[ "$COUNT" -eq 0 ]]; then
              echo "❌ File JSON là array rỗng"
              exit 1
            fi

            DATA="$(jq -c '.[0]' "$FILE")"

          elif [[ "$JSON_TYPE" == "object" ]]; then
            DATA="$(jq -c '.' "$FILE")"

          else
            echo "❌ JSON phải là object hoặc array chứa object"
            exit 1
          fi

          HO_TEN="$(jq -r '.ho_ten // .name // empty' <<< "$DATA")"
          PHONE="$(jq -r '.so_dien_thoai // .phone // empty' <<< "$DATA")"
          EMAIL="$(jq -r '.email // empty' <<< "$DATA")"

          POSITION="$(jq -r '.position // .role // empty' <<< "$DATA")"
          SCORE="$(jq -r '.total_score_display // .score // empty' <<< "$DATA")"
          VERDICT="$(jq -r '.overall_verdict // .verdict // empty' <<< "$DATA")"

          CV_URL="$(
            jq -r '.URL // .url // empty' <<< "$DATA" |
            sed 's/[[:space:]]*$//'
          )"

          DIMENSION_A="$(jq -r '.dimension_a // empty' <<< "$DATA")"
          SCORE_A="$(jq -r '.score_display_a // empty' <<< "$DATA")"
          REASON_A="$(jq -r '.reason_a // empty' <<< "$DATA")"

          DIMENSION_B="$(jq -r '.dimension_b // empty' <<< "$DATA")"
          SCORE_B="$(jq -r '.score_display_b // empty' <<< "$DATA")"
          REASON_B="$(jq -r '.reason_b // empty' <<< "$DATA")"

          DIMENSION_C="$(jq -r '.dimension_c // empty' <<< "$DATA")"
          SCORE_C="$(jq -r '.score_display_c // empty' <<< "$DATA")"
          REASON_C="$(jq -r '.reason_c // empty' <<< "$DATA")"

          DIMENSION_D="$(jq -r '.dimension_d // empty' <<< "$DATA")"
          SCORE_D="$(jq -r '.score_display_d // empty' <<< "$DATA")"
          REASON_D="$(jq -r '.reason_d // empty' <<< "$DATA")"

          DIMENSION_E="$(jq -r '.dimension_e // empty' <<< "$DATA")"
          SCORE_E="$(jq -r '.score_display_e // empty' <<< "$DATA")"
          REASON_E="$(jq -r '.reason_e // empty' <<< "$DATA")"

          DIMENSION_F="$(jq -r '.dimension_f // empty' <<< "$DATA")"
          SCORE_F="$(jq -r '.score_display_f // empty' <<< "$DATA")"
          REASON_F="$(jq -r '.reason_f // empty' <<< "$DATA")"

          if [[ -z "$HO_TEN" ]]; then
            echo "❌ Thiếu ho_ten"
            exit 1
          fi

          if [[ -z "$POSITION" ]]; then
            echo "❌ Thiếu position hoặc role"
            exit 1
          fi

          if [[ -z "$SCORE" ]]; then
            echo "❌ Thiếu total_score_display"
            exit 1
          fi

          if [[ -z "$VERDICT" ]]; then
            echo "❌ Thiếu overall_verdict"
            exit 1
          fi

          write_output() {
            local key="$1"
            local value="$2"
            local delimiter="EOF_${key}_$(date +%s%N)"

            {
              echo "${key}<<${delimiter}"
              echo "$value"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
          }

          write_output "ho_ten" "$HO_TEN"
          write_output "phone" "$PHONE"
          write_output "email" "$EMAIL"
          write_output "position" "$POSITION"
          write_output "score" "$SCORE"
          write_output "verdict" "$VERDICT"
          write_output "url" "$CV_URL"

          write_output "dimension_a" "$DIMENSION_A"
          write_output "score_a" "$SCORE_A"
          write_output "reason_a" "$REASON_A"

          write_output "dimension_b" "$DIMENSION_B"
          write_output "score_b" "$SCORE_B"
          write_output "reason_b" "$REASON_B"

          write_output "dimension_c" "$DIMENSION_C"
          write_output "score_c" "$SCORE_C"
          write_output "reason_c" "$REASON_C"

          write_output "dimension_d" "$DIMENSION_D"
          write_output "score_d" "$SCORE_D"
          write_output "reason_d" "$REASON_D"

          write_output "dimension_e" "$DIMENSION_E"
          write_output "score_e" "$SCORE_E"
          write_output "reason_e" "$REASON_E"

          write_output "dimension_f" "$DIMENSION_F"
          write_output "score_f" "$SCORE_F"
          write_output "reason_f" "$REASON_F"

          echo "✅ Đọc CV thành công"
          echo "Ứng viên: $HO_TEN"
          echo "Vị trí: $POSITION"
          echo "Điểm: $SCORE"
          echo "Đánh giá: $VERDICT"

      - name: Get Lark access token
        id: token
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${LARK_APP_ID:-}" ]]; then
            echo "❌ Thiếu secret LARK_APP_ID"
            exit 1
          fi

          if [[ -z "${LARK_APP_SECRET:-}" ]]; then
            echo "❌ Thiếu secret LARK_APP_SECRET"
            exit 1
          fi

          PAYLOAD="$(
            jq -nc \
              --arg app_id "$LARK_APP_ID" \
              --arg app_secret "$LARK_APP_SECRET" \
              '{
                app_id: $app_id,
                app_secret: $app_secret
              }'
          )"

          RESPONSE="$(
            curl --silent --show-error \
              --request POST \
              "https://open.larksuite.com/open-apis/auth/v3/tenant_access_token/internal" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data "$PAYLOAD"
          )"

          CODE="$(jq -r '.code // -1' <<< "$RESPONSE")"
          TOKEN="$(jq -r '.tenant_access_token // empty' <<< "$RESPONSE")"

          if [[ "$CODE" != "0" || -z "$TOKEN" ]]; then
            echo "❌ Không lấy được Lark access token"
            echo "$RESPONSE" | jq . || echo "$RESPONSE"
            exit 1
          fi

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "✅ Đã lấy Lark access token"

      - name: Send Lark Card
        env:
          LARK_TOKEN: ${{ steps.token.outputs.token }}

          HO_TEN: ${{ steps.cv.outputs.ho_ten }}
          PHONE: ${{ steps.cv.outputs.phone }}
          EMAIL: ${{ steps.cv.outputs.email }}
          POSITION: ${{ steps.cv.outputs.position }}
          SCORE: ${{ steps.cv.outputs.score }}
          VERDICT: ${{ steps.cv.outputs.verdict }}
          CV_URL: ${{ steps.cv.outputs.url }}

          DIMENSION_A: ${{ steps.cv.outputs.dimension_a }}
          SCORE_A: ${{ steps.cv.outputs.score_a }}
          REASON_A: ${{ steps.cv.outputs.reason_a }}

          DIMENSION_B: ${{ steps.cv.outputs.dimension_b }}
          SCORE_B: ${{ steps.cv.outputs.score_b }}
          REASON_B: ${{ steps.cv.outputs.reason_b }}

          DIMENSION_C: ${{ steps.cv.outputs.dimension_c }}
          SCORE_C: ${{ steps.cv.outputs.score_c }}
          REASON_C: ${{ steps.cv.outputs.reason_c }}

          DIMENSION_D: ${{ steps.cv.outputs.dimension_d }}
          SCORE_D: ${{ steps.cv.outputs.score_d }}
          REASON_D: ${{ steps.cv.outputs.reason_d }}

          DIMENSION_E: ${{ steps.cv.outputs.dimension_e }}
          SCORE_E: ${{ steps.cv.outputs.score_e }}
          REASON_E: ${{ steps.cv.outputs.reason_e }}

          DIMENSION_F: ${{ steps.cv.outputs.dimension_f }}
          SCORE_F: ${{ steps.cv.outputs.score_f }}
          REASON_F: ${{ steps.cv.outputs.reason_f }}

        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${LARK_TOKEN:-}" ]]; then
            echo "❌ LARK_TOKEN đang rỗng"
            exit 1
          fi

          case "${VERDICT,,}" in
            "strong")
              TEMPLATE="green"
              ICON="🟢"
              ;;
            "consider"|"considerable")
              TEMPLATE="orange"
              ICON="🟡"
              ;;
            "weak")
              TEMPLATE="red"
              ICON="🔴"
              ;;
            *)
              TEMPLATE="grey"
              ICON="⚪"
              ;;
          esac

          CARD="$(
            jq -nc \
              --arg template "$TEMPLATE" \
              --arg icon "$ICON" \
              --arg ho_ten "$HO_TEN" \
              --arg phone "$PHONE" \
              --arg email "$EMAIL" \
              --arg position "$POSITION" \
              --arg score "$SCORE" \
              --arg verdict "$VERDICT" \
              --arg url "$CV_URL" \
              --arg dimension_a "$DIMENSION_A" \
              --arg score_a "$SCORE_A" \
              --arg reason_a "$REASON_A" \
              --arg dimension_b "$DIMENSION_B" \
              --arg score_b "$SCORE_B" \
              --arg reason_b "$REASON_B" \
              --arg dimension_c "$DIMENSION_C" \
              --arg score_c "$SCORE_C" \
              --arg reason_c "$REASON_C" \
              --arg dimension_d "$DIMENSION_D" \
              --arg score_d "$SCORE_D" \
              --arg reason_d "$REASON_D" \
              --arg dimension_e "$DIMENSION_E" \
              --arg score_e "$SCORE_E" \
              --arg reason_e "$REASON_E" \
              --arg dimension_f "$DIMENSION_F" \
              --arg score_f "$SCORE_F" \
              --arg reason_f "$REASON_F" \
              '
              def fallback($value; $default):
                if ($value | length) == 0 then
                  $default
                else
                  $value
                end;

              def assessment($number; $dimension; $score; $reason):
                {
                  tag: "div",
                  text: {
                    tag: "lark_md",
                    content: (
                      "**" +
                      $number +
                      ". " +
                      fallback($dimension; "Chưa có tên tiêu chí") +
                      "**\n\n" +
                      "**Điểm: " +
                      fallback($score; "Chưa có dữ liệu") +
                      "**\n\n" +
                      fallback($reason; "Chưa có phần giải thích.")
                    )
                  }
                };

              {
                config: {
                  wide_screen_mode: true
                },

                header: {
                  template: $template,
                  title: {
                    tag: "plain_text",
                    content: ($icon + " CV Candidate Screening")
                  }
                },

                elements: (
                  [
                    {
                      tag: "div",
                      text: {
                        tag: "lark_md",
                        content: (
                          "# 👤 " +
                          fallback($ho_ten; "Ứng viên chưa xác định")
                        )
                      }
                    },

                    {
                      tag: "div",
                      text: {
                        tag: "lark_md",
                        content: (
                          "**💼 Vị trí ứng tuyển**\n" +
                          fallback($position; "Chưa có dữ liệu")
                        )
                      }
                    },

                    {
                      tag: "hr"
                    },

                    {
                      tag: "div",
                      fields: [
                        {
                          is_short: true,
                          text: {
                            tag: "lark_md",
                            content: (
                              "**⭐ Tổng điểm**\n" +
                              fallback($score; "Chưa có dữ liệu")
                            )
                          }
                        },
                        {
                          is_short: true,
                          text: {
                            tag: "lark_md",
                            content: (
                              "**📊 Đánh giá**\n" +
                              fallback($verdict; "Chưa có dữ liệu")
                            )
                          }
                        }
                      ]
                    },

                    {
                      tag: "div",
                      fields: [
                        {
                          is_short: true,
                          text: {
                            tag: "lark_md",
                            content: (
                              "**📞 Điện thoại**\n" +
                              fallback($phone; "Không có dữ liệu")
                            )
                          }
                        },
                        {
                          is_short: true,
                          text: {
                            tag: "lark_md",
                            content: (
                              "**✉️ Email**\n" +
                              fallback($email; "Không có dữ liệu")
                            )
                          }
                        }
                      ]
                    },

                    {
                      tag: "hr"
                    },

                    {
                      tag: "div",
                      text: {
                        tag: "lark_md",
                        content: "### 📋 Chi tiết đánh giá"
                      }
                    },

                    assessment(
                      "1";
                      $dimension_a;
                      $score_a;
                      $reason_a
                    ),

                    assessment(
                      "2";
                      $dimension_b;
                      $score_b;
                      $reason_b
                    ),

                    assessment(
                      "3";
                      $dimension_c;
                      $score_c;
                      $reason_c
                    ),

                    assessment(
                      "4";
                      $dimension_d;
                      $score_d;
                      $reason_d
                    ),

                    assessment(
                      "5";
                      $dimension_e;
                      $score_e;
                      $reason_e
                    ),

                    assessment(
                      "6";
                      $dimension_f;
                      $score_f;
                      $reason_f
                    ),

                    {
                      tag: "hr"
                    }
                  ]
                  +
                  (
                    if ($url | length) > 0 then
                      [
                        {
                          tag: "action",
                          actions: [
                            {
                              tag: "button",
                              type: "primary",
                              text: {
                                tag: "plain_text",
                                content: "📄 Xem CV trên Google Drive"
                              },
                              url: $url
                            }
                          ]
                        }
                      ]
                    else
                      []
                    end
                  )
                )
              }
              '
          )"

          if ! jq empty <<< "$CARD" >/dev/null 2>&1; then
            echo "❌ Card JSON không hợp lệ"
            echo "$CARD"
            exit 1
          fi

          RECEIVERS=(
            "ou_f77cf794a1319628941dd689ecc97e32"
          )

          FAIL=0

          for RID in "${RECEIVERS[@]}"; do
            MESSAGE_PAYLOAD="$(
              jq -nc \
                --arg rid "$RID" \
                --arg card "$CARD" \
                '{
                  receive_id: $rid,
                  msg_type: "interactive",
                  content: $card
                }'
            )"

            RESPONSE="$(
              curl --silent --show-error \
                --request POST \
                "https://open.larksuite.com/open-apis/im/v1/messages?receive_id_type=open_id" \
                --header "Authorization: Bearer $LARK_TOKEN" \
                --header "Content-Type: application/json; charset=utf-8" \
                --data "$MESSAGE_PAYLOAD"
            )"

            CODE="$(jq -r '.code // -1' <<< "$RESPONSE")"

            if [[ "$CODE" == "0" ]]; then
              echo "✅ Sent to $RID"
            else
              echo "❌ Failed to $RID"
              echo "$RESPONSE" | jq . || echo "$RESPONSE"
              FAIL=1
            fi
          done

          if [[ "$FAIL" -eq 1 ]]; then
            echo "❌ Có ít nhất một tin nhắn gửi thất bại"
            exit 1
          fi

          echo "🎉 Gửi toàn bộ Lark Card thành công"
